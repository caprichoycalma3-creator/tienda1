<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capricho y Calma | Tienda Oficial</title>
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #080c14;
            --card-bg: #111827;
            --blue-neon: #0072ff;
            --gold: #f5a623;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); padding-bottom: 80px; }

        header {
            background: rgba(8, 12, 20, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid var(--blue-neon);
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.15);
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .brand-title { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .brand-title span { color: var(--blue-neon); }

        .cart-btn {
            background: linear-gradient(135deg, var(--blue-neon), #0044ff);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px rgba(0, 114, 255, 0.4);
            transition: all 0.2s;
        }
        .cart-btn:hover { transform: scale(1.05); }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 30px; overflow-x: auto; padding-bottom: 8px; }
        .filter-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .filter-btn.active, .filter-btn:hover { background: var(--blue-neon); color: #fff; border-color: var(--blue-neon); }

        .grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--blue-neon); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        .card-img { width: 100%; height: 210px; object-fit: cover; background: #000; }
        .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 1.15rem; margin-bottom: 8px; font-weight: 600; }
        .card-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; line-height: 1.4; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
        .price { font-weight: 700; color: var(--gold); font-size: 1.15rem; }
        
        .add-btn {
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-btn:hover { transform: scale(1.05); }

        /* Modales */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            padding: 20px;
        }
        .modal.open { display: flex; }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-radius: 16px;
            padding: 25px;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--blue-neon);
            box-shadow: 0 0 30px rgba(0, 114, 255, 0.2);
        }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.8rem; cursor: pointer; }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
        .form-input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0d1322;
            color: #fff;
            font-size: 0.95rem;
        }

        .payment-box {
            background: #0d1322;
            padding: 18px;
            border-radius: 12px;
            margin-top: 20px;
            border: 1px solid var(--border-color);
        }

        .nequi-box {
            background: linear-gradient(135deg, #1f0836, #3b0a57);
            border: 1px solid #ff007f;
            padding: 15px;
            border-radius: 10px;
            margin-top: 12px;
            text-align: center;
        }

        .copy-btn {
            background: #ff007f;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .pay-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--blue-neon), #0044ff);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        /* Estilos del Ticket */
        .ticket-box {
            background: #ffffff;
            color: #000000;
            padding: 25px;
            border-radius: 8px;
            font-family: 'Courier New', Courier, monospace;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin-bottom: 15px;
        }

        .ticket-header { text-align: center; border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 15px; }
        .ticket-title { font-weight: bold; font-size: 1.3rem; }
        .ticket-row { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 6px; }
        .ticket-divider { border-top: 1px dashed #000; margin: 10px 0; }
        .ticket-total { font-size: 1.1rem; font-weight: bold; text-align: right; }

        .btn-action {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-print { background: var(--gold); color: #000; }
        .btn-wa { background: #25d366; color: #fff; }

        @media print {
            body * { visibility: hidden; }
            #ticket-modal, #ticket-modal * { visibility: visible; }
            #ticket-modal { position: absolute; left: 0; top: 0; width: 100%; background: none; }
            .btn-action, .close-btn { display: none !important; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="Logo Capricho y Calma" class="logo-img" onerror="tryNextFormat(this, ['logo.png', 'logo.jpeg'])">
            <div class="brand-title">CAPRICHO <span>Y CALMA</span></div>
        </div>
        <button class="cart-btn" id="open-cart">
            🛒 Carrito (<span id="cart-count">0</span>)
        </button>
    </header>

    <main class="container">
        <div class="filter-bar">
            <button class="filter-btn active" data-cat="todos">Todos</button>
            <button class="filter-btn" data-cat="snacks">Snacks & Postres</button>
            <button class="filter-btn" data-cat="accesorios">Accesorios</button>
            <button class="filter-btn" data-cat="papeleria">Papelería</button>
        </div>

        <div class="grid-productos" id="grid-productos"></div>
    </main>

    <!-- Modal Carrito y Pago -->
    <div class="modal" id="cart-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Pasarela de Pago</h3>
                <button class="close-btn" id="close-cart">&times;</button>
            </div>
            
            <div id="cart-items"></div>
            <div style="margin-top: 15px; text-align: right; font-weight: 700; font-size: 1.2rem;">
                Total: $<span id="cart-total">0</span> COP
            </div>

            <!-- Datos del Cliente -->
            <div style="margin-top: 15px;">
                <div class="form-group">
                    <label>Nombre Completo:</label>
                    <input type="text" id="client-name" class="form-input" placeholder="Ej: Juan Pérez" required>
                </div>
            </div>

            <div class="payment-box">
                <h4 style="margin-bottom: 10px;">Selecciona Método de Pago</h4>
                <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; cursor: pointer;">
                    <input type="radio" name="pago" value="Nequi" checked onchange="togglePagoFields()"> Nequi
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="radio" name="pago" value="PSE" onchange="togglePagoFields()"> PSE / Banco
                </label>

                <!-- Caja Nequi -->
                <div class="nequi-box" id="nequi-info">
                    <p style="font-size: 0.85rem;">Transfiere a nuestra cuenta Nequi:</p>
                    <strong style="font-size: 1.3rem; color: #fff;">3116028164</strong><br>
                    <button class="copy-btn" type="button" id="copy-nequi">Copiar Número</button>
                    
                    <div class="form-group" style="margin-top: 12px; text-align: left;">
                        <label>Código M-Comprobante Nequi:</label>
                        <input type="text" id="nequi-ref" class="form-input" placeholder="Ej: M12345678">
                    </div>
                </div>

                <!-- Caja PSE -->
                <div id="pse-info" style="display: none; margin-top: 10px;">
                    <div class="form-group">
                        <label>Selecciona tu Banco:</label>
                        <select id="pse-bank" class="form-input">
                            <option value="Bancolombia">Bancolombia</option>
                            <option value="Nequi PSE">Nequi PSE</option>
                            <option value="Davivienda">Davivienda / Daviplata</option>
                            <option value="Lulo Bank">Lulo Bank</option>
                            <option value="Nu Colombia">Nu Colombia</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Número de Cédula:</label>
                        <input type="text" id="pse-id" class="form-input" placeholder="Ej: 1098765432">
                    </div>
                </div>
            </div>

            <button class="pay-submit-btn" id="btn-pay-process">
                💳 Pagar y Generar Ticket
            </button>
        </div>
    </div>

    <!-- Modal Ticket de Compra -->
    <div class="modal" id="ticket-modal">
        <div class="modal-content" style="background: transparent; border: none; box-shadow: none;">
            <div class="ticket-box">
                <div class="ticket-header">
                    <div class="ticket-title">CAPRICHO Y CALMA</div>
                    <div>NIT/RUT: 1130028164-1</div>
                    <div>WhatsApp: +57 3116028164</div>
                    <div style="margin-top: 5px; font-size: 0.8rem;" id="t-date"></div>
                    <div style="font-size: 0.8rem; font-weight: bold;" id="t-num"></div>
                </div>

                <div class="ticket-row"><strong>Cliente:</strong> <span id="t-client"></span></div>
                <div class="ticket-row"><strong>Método de Pago:</strong> <span id="t-method"></span></div>
                <div class="ticket-row" id="t-ref-row"><strong>Ref/Comprobante:</strong> <span id="t-ref"></span></div>

                <div class="ticket-divider"></div>
                <div id="t-items"></div>
                <div class="ticket-divider"></div>

                <div class="ticket-total">TOTAL PAGADO: $<span id="t-total"></span> COP</div>
                <div style="text-align: center; margin-top: 15px; font-size: 0.8rem; font-weight: bold;">
                    ¡GRACIAS POR TU COMPRA!
                </div>
            </div>

            <button class="btn-action btn-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
            <button class="btn-action btn-wa" id="btn-ticket-wa">📲 Enviar Confirmación por WhatsApp</button>
            <button class="btn-action" style="background: #334155; color: #fff;" id="close-ticket">Cerrar</button>
        </div>
    </div>

    <script>
        function tryNextFormat(img, fallbacks) {
            if (!fallbacks || fallbacks.length === 0) return;
            const nextSrc = fallbacks.shift();
            img.onerror = () => tryNextFormat(img, fallbacks);
            img.src = nextSrc;
        }

        function togglePagoFields() {
            const metodo = document.querySelector('input[name="pago"]:checked').value;
            document.getElementById('nequi-info').style.display = metodo === 'Nequi' ? 'block' : 'none';
            document.getElementById('pse-info').style.display = metodo === 'PSE' ? 'block' : 'none';
        }

        document.addEventListener("DOMContentLoaded", () => {
            const productos = [
                { id: "oblea", nombre: "Oblea Artesanal", categoria: "snacks", precio: 2500, precioTexto: "$2.000 - $3.000", imagen: "oblea.png", fallbacks: ["oblea.jpg", "oblea.jpeg"], descripcion: "Oblea artesanal con salsa de mora, queso rallado y arequipe." },
                { id: "manillas", nombre: "Manillas Artesanales", categoria: "accesorios", precio: 2000, precioTexto: "$2.000 - $2.500", imagen: "manillas.jpg", fallbacks: ["manillas.png", "manillas.jpeg"], descripcion: "Set de manillas tejidas a mano con dije San Benito." },
                { id: "gelatina", nombre: "Gelatinas Multicolor", categoria: "snacks", precio: 2000, precioTexto: "$2.000 - $2.500", imagen: "gelatina.png", fallbacks: ["gelatina.jpg", "gelatina.jpeg"], descripcion: "Vasitos de gelatina de sabores surtidos." },
                { id: "lapiceros", nombre: "Lapiceros Kawaii", categoria: "papeleria", precio: 2000, precioTexto: "$2.000", imagen: "lapiceros.jpg", fallbacks: ["lapiceros.png", "lapiceros.jpeg"], descripcion: "Lapiceros animados con tintas de múltiples colores." },
                { id: "borradores", nombre: "Borradores 3D", categoria: "papeleria", precio: 1000, precioTexto: "$1.000", imagen: "borradores.jpg", fallbacks: ["borradores.png", "borradores.jpeg"], descripcion: "Borradores armables en forma de frutas y verduras." }
            ];

            let carrito = JSON.parse(localStorage.getItem("capricho_carrito")) || [];
            let ultimoPedido = null;

            function renderProductos(categoria = "todos") {
                const grid = document.getElementById("grid-productos");
                grid.innerHTML = "";
                const filtrados = categoria === "todos" ? productos : productos.filter(p => p.categoria === categoria);

                filtrados.forEach(prod => {
                    const card = document.createElement("div");
                    card.className = "card";
                    card.innerHTML = `
                        <img src="${prod.imagen}" alt="${prod.nombre}" class="card-img" onerror="tryNextFormat(this, [${prod.fallbacks.map(f => `'${f}'`).join(',')}])">
                        <div class="card-body">
                            <h4 class="card-title">${prod.nombre}</h4>
                            <p class="card-desc">${prod.descripcion}</p>
                            <div class="card-footer">
                                <span class="price">${prod.precioTexto}</span>
                                <button class="add-btn" onclick="agregarAlCarrito('${prod.id}')">Agregar</button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            window.agregarAlCarrito = (id) => {
                const prod = productos.find(p => p.id === id);
                const existe = carrito.find(item => item.id === id);
                if (existe) { existe.cantidad++; } else { carrito.push({ ...prod, cantidad: 1 }); }
                actualizarCarrito();
            };

            function actualizarCarrito() {
                localStorage.setItem("capricho_carrito", JSON.stringify(carrito));
                document.getElementById("cart-count").textContent = carrito.reduce((sum, item) => sum + item.cantidad, 0);
                const container = document.getElementById("cart-items");
                container.innerHTML = "";

                if (carrito.length === 0) {
                    container.innerHTML = "<p style='color: var(--text-muted); text-align: center;'>Carrito vacío.</p>";
                } else {
                    carrito.forEach(item => {
                        const row = document.createElement("div");
                        row.className = "cart-item";
                        row.innerHTML = `
                            <div><strong>${item.nombre}</strong><br><small style='color:var(--gold)'>$${item.precio.toLocaleString()} x ${item.cantidad}</small></div>
                            <div style="display:flex; gap:8px;">
                                <button onclick="cambiarCantidad('${item.id}', -1)">-</button>
                                <span>${item.cantidad}</span>
                                <button onclick="cambiarCantidad('${item.id}', 1)">+</button>
                            </div>
                        `;
                        container.appendChild(row);
                    });
                }
                const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
                document.getElementById("cart-total").textContent = total.toLocaleString();
            }

            window.cambiarCantidad = (id, cambio) => {
                const item = carrito.find(i => i.id === id);
                if (item) {
                    item.cantidad += cambio;
                    if (item.cantidad <= 0) carrito = carrito.filter(i => i.id !== id);
                    actualizarCarrito();
                }
            };

            document.getElementById("open-cart").addEventListener("click", () => document.getElementById("cart-modal").classList.add("open"));
            document.getElementById("close-cart").addEventListener("click", () => document.getElementById("cart-modal").classList.remove("open"));
            document.getElementById("close-ticket").addEventListener("click", () => document.getElementById("ticket-modal").classList.remove("open"));

            document.getElementById("copy-nequi").addEventListener("click", () => {
                navigator.clipboard.writeText("3116028164");
                alert("¡Número Nequi (3116028164) copiado!");
            });

            document.querySelectorAll(".filter-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
                    e.target.classList.add("active");
                    renderProductos(e.target.dataset.cat);
                });
            });

            // Procesar Pago y Generar Ticket
            document.getElementById("btn-pay-process").addEventListener("click", () => {
                if (carrito.length === 0) { alert("El carrito está vacío."); return; }
                const cliente = document.getElementById("client-name").value.trim();
                if (!cliente) { alert("Por favor ingresa tu nombre."); return; }

                const metodo = document.querySelector('input[name="pago"]:checked').value;
                let refPago = "";

                if (metodo === "Nequi") {
                    refPago = document.getElementById("nequi-ref").value.trim() || "PENDIENTE-APROBACION";
                } else {
                    refPago = document.getElementById("pse-bank").value + " - CC " + (document.getElementById("pse-id").value || "S/N");
                }

                const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
                const fecha = new Date().toLocaleString("es-CO");
                const numTicket = "CYC-" + Math.floor(100000 + Math.random() * 900000);

                ultimoPedido = { numTicket, fecha, cliente, metodo, refPago, items: [...carrito], total };

                // Llenar datos en el Ticket
                document.getElementById("t-date").textContent = fecha;
                document.getElementById("t-num").textContent = "TICKET #: " + numTicket;
                document.getElementById("t-client").textContent = cliente;
                document.getElementById("t-method").textContent = metodo;
                document.getElementById("t-ref").textContent = refPago;
                document.getElementById("t-total").textContent = total.toLocaleString();

                const tItems = document.getElementById("t-items");
                tItems.innerHTML = "";
                carrito.forEach(i => {
                    const r = document.createElement("div");
                    r.className = "ticket-row";
                    r.innerHTML = `<span>${i.cantidad}x ${i.nombre}</span><span>$${(i.precio * i.cantidad).toLocaleString()}</span>`;
                    tItems.appendChild(r);
                });

                // Resetear carrito y mostrar ticket
                carrito = [];
                actualizarCarrito();
                document.getElementById("cart-modal").classList.remove("open");
                document.getElementById("ticket-modal").classList.add("open");
            });

            // Confirmar por WhatsApp
            document.getElementById("btn-ticket-wa").addEventListener("click", () => {
                if (!ultimoPedido) return;
                let msg = `🧾 *TICKET DE COMPRA - CAPRICHO Y CALMA*\n`;
                msg += `*Ticket:* ${ultimoPedido.numTicket}\n`;
                msg += `*Cliente:* ${ultimoPedido.cliente}\n`;
                msg += `*Método:* ${ultimoPedido.metodo} (${ultimoPedido.refPago})\n\n`;
                msg += `*Productos:*\n`;
                ultimoPedido.items.forEach(i => {
                    msg += `• ${i.cantidad}x ${i.nombre} = $${(i.precio * i.cantidad).toLocaleString()}\n`;
                });
                msg += `\n💰 *Total Pagado:* $${ultimoPedido.total.toLocaleString()} COP`;

                const url = `https://wa.me/573116028164?text=${encodeURIComponent(msg)}`;
                window.open(url, "_blank");
            });

            renderProductos();
            actualizarCarrito();
        });
    </script>
</body>
</html>
